<!doctype html>
    <html lang="en">
      <head>
        <meta charset="utf-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <title>My WOD Coach | My WOD Coach</title>
        <meta name="description" content="Support and privacy information for My WOD Coach." />
        <style>
          :root {
            color-scheme: light;
            font-family: Arial, Helvetica, sans-serif;
            color: #0f172a;
            background: #f4f7fb;
          }
          * {
            box-sizing: border-box;
          }
          body {
            margin: 0;
            background: #f4f7fb;
          }
          main {
            width: min(920px, 100%);
            margin: 0 auto;
            padding: 48px 20px;
          }
          article {
            border: 1px solid #d9e2ef;
            border-radius: 10px;
            background: #ffffff;
            padding: clamp(28px, 5vw, 48px);
            box-shadow: 0 10px 30px rgba(15, 23, 42, 0.06);
          }
          .brand {
            color: #1d4ed8;
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
          }
          .mark {
            display: inline-flex;
            width: 58px;
            height: 58px;
            align-items: center;
            justify-content: center;
            margin-bottom: 24px;
            border: 1px solid #bfdbfe;
            border-radius: 12px;
            background: #eff6ff;
            color: #1d4ed8;
            font-size: 20px;
            font-weight: 900;
          }
          h1 {
            margin: 16px 0 0;
            font-size: clamp(34px, 7vw, 56px);
            line-height: 1;
            letter-spacing: -0.03em;
          }
          h2 {
            margin: 0 0 14px;
            font-size: 24px;
          }
          p,
          li {
            font-size: 16px;
            line-height: 1.75;
            color: #475569;
          }
          a {
            color: #1d4ed8;
            font-weight: 800;
            text-decoration: none;
          }
          a:hover {
            text-decoration: underline;
          }
          section {
            margin-top: 34px;
          }
          ul {
            margin: 0;
            padding-left: 22px;
          }
          li + li {
            margin-top: 10px;
          }
          .lead {
            max-width: 720px;
            margin-top: 24px;
            font-size: 18px;
          }
          .meta {
            margin-top: 14px;
            color: #64748b;
            font-size: 14px;
          }
          .link-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 16px;
            margin-top: 36px;
          }
          .tile {
            display: block;
            min-height: 150px;
            border: 1px solid #d9e2ef;
            border-radius: 10px;
            padding: 24px;
            background: #ffffff;
          }
          .tile strong {
            display: block;
            color: #0f172a;
            font-size: 22px;
          }
          .tile span {
            display: block;
            margin-top: 12px;
            color: #475569;
            line-height: 1.6;
          }
        </style>
      </head>
      <body>
        <main>
          <article>
            <div class="mark">MWC</div>
            <div class="brand">My WOD Coach</div>
            <h1>My WOD Coach</h1>
            
      <p class="lead">Official support and policy pages for My WOD Coach, a personalized CrossFit-style WOD planning app.</p>

        <a class="tile" href="./support.html">

          <span>Contact and troubleshooting information for the app.</span>
        </a>
      </div>
